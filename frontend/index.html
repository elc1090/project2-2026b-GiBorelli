<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conecta Blocos</title>
  <meta name="theme-color" content="#111111" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Conecta Blocos</p>
      <h3>Recrie Algoritmos de Programação Conectando Blocos!</h3>
    </div>
  </header>

  <main class="app-shell">
    <section id="home-view" class="view">
      <div class="section-header">
        <h2>Selecione uma questão</h2>
      </div>
      <div id="lista-questoes" class="questao-list" aria-live="polite"></div>
    </section>

    <button id="voltar-home-btn" class="secondary-btn hidden" type="button">Voltar para questões</button>
    <section id="question-view" class="view hidden">
      <div class="question-detalhe">
        <!-- <p class="eyebrow">Questão atual</p> -->
        <h2 id="titulo-questao"></h2>
        <p id="enunciado-questao"></p>
      </div>

      <div class="blockly-panel">
        <div id="blockly-edit" aria-label="Editor Blockly"></div>
      </div>

      <div class="action-bar">
        <button id="executar-btn" type="button">Executar</button>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/python_compressed.js"></script>
  <script src="script.js"></script>
</body>
</html>
